spring.application.name=bhuraksha-backend
server.port=8081

# FastAPI model-service URL. Start the ML service before using /api/risk.
ml.service.base-url=http://localhost:8001

# Immediate Moderate/High risk email alert. SMTP credentials stay outside source
# control: provide MAIL_USERNAME and MAIL_PASSWORD as environment variables.
# For Gmail, MAIL_PASSWORD must be a Google App Password (not the account password).
alerts.email.enabled=${ALERT_EMAIL_ENABLED:true}
alerts.email.recipient=${ALERT_EMAIL_RECIPIENT:arungowdru29@gmail.com}
alerts.email.sender=${ALERT_EMAIL_SENDER:${spring.mail.username:}}
# Zero means every explicit user risk check sends an alert immediately.
alerts.email.cooldown-seconds=${ALERT_EMAIL_COOLDOWN_SECONDS:0}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

